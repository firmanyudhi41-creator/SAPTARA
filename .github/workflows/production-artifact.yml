name: Production Artifact Build (Zero-Shell cPanel)

on:
  push:
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version Name (e.g. v1.0.0)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build-production-artifact:
    name: Build & Package Static & PHP Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        if: github.event_name == 'push'
        run: |
          echo "Memverifikasi apakah tag '${{ github.ref_name }}' (commit ${{ github.sha }}) berada di branch 'main'..."
          git fetch origin main --depth=1000
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "✅ Terverifikasi: Tag berada pada riwayat commit branch 'main'."
          else
            echo "❌ Error: Tag '${{ github.ref_name }}' tidak dibuat dari branch 'main'."
            exit 1
          fi

      - name: Determine Version Name
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          # Sanitize tag name
          CLEAN_TAG=$(echo "$TAG_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "RELEASE_NAME=saptara-production-${CLEAN_TAG}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "CLEAN_TAG=${CLEAN_TAG}" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js (Static Build)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Frontend Assets (React + Tailwind via Vite)
        run: |
          echo "Mengompilasi aset aplikasi React menjadi bundle statis..."
          pnpm build

          # Verifikasi file manifest dan aset statis hasil kompilasi
          if [ ! -f "public/build/manifest.json" ]; then
            echo "❌ Error: File public/build/manifest.json tidak ditemukan setelah proses build!"
            exit 1
          fi
          echo "✅ Aset statis berhasil dikompilasi ke folder public/build/:"
          ls -lh public/build/assets/

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, gd, zip, bcmath
          coverage: none

      - name: Install Composer Dependencies (Production Mode)
        run: |
          echo "Mengunduh dan mengoptimasi dependensi PHP untuk produksi..."
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Package Production Artifact (Dual-Folder cPanel Ready)
        run: |
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          STAGING_DIR="${DIST_DIR}/${RELEASE_NAME}"
          APP_DIR="${STAGING_DIR}/saptara"
          PUBLIC_DIR="${STAGING_DIR}/public_html"

          mkdir -p "${APP_DIR}" "${PUBLIC_DIR}"

          echo "1. Menyalin direktori aplikasi Laravel ke ${APP_DIR}..."
          cp -r app bootstrap config database resources routes artisan composer.json composer.lock .env.example .env.cpanel.example DEPLOY.md "${APP_DIR}/"
          cp -r vendor "${APP_DIR}/"

          # Siapkan placeholder folder public di dalam saptara
          mkdir -p "${APP_DIR}/public"
          touch "${APP_DIR}/public/.gitkeep"

          echo "2. Menyalin direktori web root ke ${PUBLIC_DIR}..."
          cp -r public/* "${PUBLIC_DIR}/"
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess "${PUBLIC_DIR}/.htaccess"
          fi

          # Pastikan file dev HMR tidak terikut
          rm -f "${PUBLIC_DIR}/hot" "${APP_DIR}/public/hot"

          echo "3. Generate random APP_KEY untuk konfigurasi cPanel..."
          GENERATED_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          sed -i "s|APP_KEY=.*|APP_KEY=${GENERATED_KEY}|g" "${APP_DIR}/.env.cpanel.example"

          echo "4. Menyiapkan struktur direktori storage yang bersih..."
          mkdir -p "${APP_DIR}/storage/app/public"
          mkdir -p "${APP_DIR}/storage/framework/cache/data"
          mkdir -p "${APP_DIR}/storage/framework/sessions"
          mkdir -p "${APP_DIR}/storage/framework/views"
          mkdir -p "${APP_DIR}/storage/logs"

          touch "${APP_DIR}/storage/logs/.gitignore"
          touch "${APP_DIR}/storage/framework/cache/.gitignore"
          touch "${APP_DIR}/storage/framework/sessions/.gitignore"
          touch "${APP_DIR}/storage/framework/views/.gitignore"

          # Bersihkan cache file sisa build lokal
          rm -f "${APP_DIR}/bootstrap/cache/"*.php

          echo "5. Menyalin panduan DEPLOY.md ke root rilis..."
          cp DEPLOY.md "${STAGING_DIR}/DEPLOY.md"

          echo "6. Mengompresi paket artefak rilis..."
          # Paket All-in-One (ekstrak di /home/user/ -> otomatis mengisi saptara/ dan public_html/)
          (cd "${STAGING_DIR}" && zip -r "../../${DIST_DIR}/${RELEASE_NAME}.zip" ./)
          (cd "${STAGING_DIR}" && tar -czf "../../${DIST_DIR}/${RELEASE_NAME}.tar.gz" ./)

          # Paket terpisah (untuk update parsial)
          (cd "${APP_DIR}" && zip -r "../../${DIST_DIR}/${RELEASE_NAME}-app-saptara.zip" ./)
          (cd "${PUBLIC_DIR}" && zip -r "../../${DIST_DIR}/${RELEASE_NAME}-public_html.zip" ./)

          echo "Ukuran artefak produksi yang berhasil dibuat:"
          ls -lh dist/*.zip dist/*.tar.gz

      - name: Upload Production Artifact (.zip All-in-One)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-cpanel-all-in-one-zip
          path: dist/${{ env.RELEASE_NAME }}.zip
          retention-days: 90

      - name: Upload Production Artifact (.tar.gz All-in-One)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-cpanel-all-in-one-tar-gz
          path: dist/${{ env.RELEASE_NAME }}.tar.gz
          retention-days: 90

      - name: Upload Individual App & Public Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-split-packages
          path: |
            dist/*-app-saptara.zip
            dist/*-public_html.zip
          retention-days: 90

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.RELEASE_NAME }}.zip
            dist/${{ env.RELEASE_NAME }}.tar.gz
            dist/${{ env.RELEASE_NAME }}-app-saptara.zip
            dist/${{ env.RELEASE_NAME }}-public_html.zip
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
